<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReimburseTrack - Kelola Bon & Pengeluaran</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (Export Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20 md:pb-6">

    <!-- Auth Section (Login/Register Modal) -->
    <div id="authContainer" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
            <h2 id="authTitle" class="text-2xl font-bold text-center mb-6 text-blue-600">Masuk Aplikasi</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="authEmail" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="authPassword" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" id="authBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Masuk</button>
            </form>
            <div class="mt-4 text-center text-sm">
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-blue-600 underline">Belum punya akun? Daftar</button>
            </div>
        </div>
    </div>

    <!-- Main Content (Hidden until Auth) -->
    <div id="appContent" class="hidden">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 no-print">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-receipt"></i> ReimburseTrack</h1>
                <button onclick="logout()" class="text-sm bg-blue-700 px-3 py-1 rounded hover:bg-blue-800"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
            </div>
        </header>

        <!-- Main Body -->
        <main class="max-w-4xl mx-auto p-4 space-y-6">
            <!-- Navigation Tabs (Mobile Bottom & Desktop Top) -->
            <div class="no-print bg-white p-2 rounded-xl shadow flex justify-around border md:relative fixed bottom-0 left-0 right-0 z-40">
                <button onclick="switchTab('dashboard')" class="tab-btn flex-1 py-2 text-center text-blue-600 font-semibold" id="tab-dashboard"><i class="fa-solid fa-chart-pie block text-lg"></i> Ringkasan</button>
                <button onclick="switchTab('add')" class="tab-btn flex-1 py-2 text-center text-gray-500 font-semibold" id="tab-add"><i class="fa-solid fa-circle-plus block text-lg"></i> + Bon Baru</button>
                <button onclick="switchTab('history')" class="tab-btn flex-1 py-2 text-center text-gray-500 font-semibold" id="tab-history"><i class="fa-solid fa-list-check block text-lg"></i> Riwayat</button>
            </div>

            <!-- View 1: Dashboard -->
            <section id="view-dashboard" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                        <p class="text-xs text-gray-500">Total Klain Bon</p>
                        <h3 id="dashTotal" class="text-xl font-bold text-gray-800">Rp 0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                        <p class="text-xs text-gray-500">Total Transaksi</p>
                        <h3 id="dashCount" class="text-xl font-bold text-gray-800">0 Bon</h3>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow space-y-2">
                    <h3 class="font-bold text-gray-700 mb-2">Aksi Cepat Laporan</h3>
                    <div class="flex gap-2">
                        <button onclick="exportToExcel()" class="flex-1 bg-green-600 text-white py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-2 hover:bg-green-700"><i class="fa-solid fa-file-excel"></i> Ekspor Excel</button>
                        <button onclick="window.print()" class="flex-1 bg-gray-700 text-white py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-2 hover:bg-gray-800"><i class="fa-solid fa-print"></i> Cetak / PDF</button>
                    </div>
                </div>
            </section>

            <!-- View 2: Add Form -->
            <section id="view-add" class="hidden bg-white p-4 rounded-xl shadow space-y-4">
                <h2 class="text-lg font-bold text-gray-700 border-b pb-2">Input Bon Pengeluaran Baru</h2>
                <form id="expenseForm" onsubmit="saveExpense(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium">Nama Proyek</label>
                        <input type="text" id="project" placeholder="Contoh: Project Wifi Jakarta" required class="w-full p-2 border rounded-lg">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium">Tanggal</label>
                            <input type="date" id="date" required class="w-full p-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Kategori</label>
                            <select id="category" class="w-full p-2 border rounded-lg">
                                <option value="Bensin">Bensin</option>
                                <option value="Makan">Makan</option>
                                <option value="Tol">Tol</option>
                                <option value="Parkir">Parkir</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Jumlah (Rp)</label>
                        <input type="number" id="amount" placeholder="0" required class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Catatan / Keterangan</label>
                        <input type="text" id="note" placeholder="Isi pertamax, parkir mall, dll." class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Foto Struk / Bon</label>
                        <input type="file" id="receiptImg" accept="image/*" capture="environment" onchange="previewImage(event)" class="w-full text-sm">
                        <img id="imgPreview" class="mt-2 h-32 object-cover rounded hidden border">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700"><i class="fa-solid fa-floppy-disk"></i> Simpan Pengeluaran</button>
                </form>
            </section>

            <!-- View 3: History & Reports -->
            <section id="view-history" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl shadow space-y-3">
                    <h3 class="font-bold text-gray-700">Filter Data</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="filterProject" placeholder="Cari Proyek..." oninput="renderHistory()" class="p-2 border rounded-lg text-sm">
                        <select id="filterCategory" onchange="renderHistory()" class="p-2 border rounded-lg text-sm">
                            <option value="">Semua Kategori</option>
                            <option value="Bensin">Bensin</option>
                            <option value="Makan">Makan</option>
                            <option value="Tol">Tol</option>
                            <option value="Parkir">Parkir</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                </div>

                <div id="historyList" class="space-y-3">
                    <!-- Dynamic Items -->
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase Modular SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuration Firebase milik Anda
        const firebaseConfig = {
		apiKey: "AIzaSyCl1prA-wQZQzSkMNU9_JsSUKmf_CuXp5c",
		authDomain: "expense-tracker-komang.firebaseapp.com",
		projectId: "expense-tracker-komang",
		storageBucket: "expense-tracker-komang.firebasestorage.app",
		messagingSenderId: "452671118843",
		appId: "1:452671118843:web:9499f180e0b94899883f5e"
	};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let expensesData = [];
        let isLoginMode = true;
        let currentBase64Image = "";

        // Default Date Today
        document.getElementById('date').valueAsDate = new Date();

        // Auth Logic
        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'Masuk Aplikasi' : 'Daftar Akun';
            document.getElementById('authBtn').innerText = isLoginMode ? 'Masuk' : 'Daftar';
            document.getElementById('toggleAuthBtn').innerText = isLoginMode ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Masuk';
        };

        window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, pass);
                } else {
                    await createUserWithEmailAndPassword(auth, email, pass);
                }
            } catch (err) {
                alert("Error Auth: " + err.message);
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                listenToExpenses();
            } else {
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('appContent').classList.add('hidden');
            }
        });

        // Tabs Logic
        window.switchTab = (tabName) => {
            ['dashboard', 'add', 'history'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.replace('text-blue-600', 'text-gray-500');
            });
            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.replace('text-gray-500', 'text-blue-600');
        };

        // Realtime Data
        function listenToExpenses() {
            const q = query(collection(db, "expenses"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                expensesData = [];
                snapshot.forEach((doc) => {
                    expensesData.push({ id: doc.id, ...doc.data() });
                });
                renderDashboard();
                renderHistory();
            });
        }

        // Save Data
        window.previewImage = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentBase64Image = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('imgPreview').src = currentBase64Image;
                    document.getElementById('imgPreview').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.saveExpense = async (e) => {
            e.preventDefault();
            const newExp = {
                userId: currentUser.uid,
                project: document.getElementById('project').value,
                date: document.getElementById('date').value,
                category: document.getElementById('category').value,
                amount: Number(document.getElementById('amount').value),
                note: document.getElementById('note').value,
                receipt: currentBase64Image,
                createdAt: new Date().toISOString()
            };
            await addDoc(collection(db, "expenses"), newExp);
            document.getElementById('expenseForm').reset();
            document.getElementById('imgPreview').classList.add('hidden');
            currentBase64Image = "";
            document.getElementById('date').valueAsDate = new Date();
            alert('Berhasil menyimpan!');
            switchTab('history');
        };

        window.deleteExpense = async (id) => {
            if (confirm("Hapus catatan bon ini?")) {
                await deleteDoc(doc(db, "expenses", id));
            }
        };

        // Render Functions
        function renderDashboard() {
            const total = expensesData.reduce((acc, curr) => acc + curr.amount, 0);
            document.getElementById('dashTotal').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            document.getElementById('dashCount').innerText = `${expensesData.length} Bon`;
        }

        window.renderHistory = () => {
            const filterProj = document.getElementById('filterProject').value.toLowerCase();
            const filterCat = document.getElementById('filterCategory').value;
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            const filtered = expensesData.filter(item => {
                return item.project.toLowerCase().includes(filterProj) && (filterCat === "" || item.category === filterCat);
            });

            filtered.sort((a,b) => new Date(b.date) - new Date(a.date));

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow flex justify-between items-center";
                card.innerHTML = `
                    <div class="space-y-1">
                        <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded">${item.project}</span>
                        <h4 class="font-bold text-gray-800">${item.category} - Rp ${item.amount.toLocaleString('id-ID')}</h4>
                        <p class="text-xs text-gray-500">${item.date} ${item.note ? '| ' + item.note : ''}</p>
                        ${item.receipt ? `<a href="${item.receipt}" target="_blank" class="text-xs text-blue-600 underline"><i class="fa-solid fa-paperclip"></i> Lihat Struk</a>` : ''}
                    </div>
                    <button onclick="deleteExpense('${item.id}')" class="text-red-500 p-2 hover:bg-red-50 rounded"><i class="fa-solid fa-trash"></i></button>
                `;
                list.appendChild(card);
            });
        };

        // Export Excel
        window.exportToExcel = () => {
            const exportData = expensesData.map((item, index) => ({
                "No": index + 1,
                "Proyek": item.project,
                "Tanggal": item.date,
                "Kategori": item.category,
                "Nominal (Rp)": item.amount,
                "Catatan": item.note
            }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap Reimburse");
            XLSX.writeFile(wb, `Reimburse_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
        };
    </script>
</body>
</html>
